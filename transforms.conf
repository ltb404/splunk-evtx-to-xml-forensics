# transforms.conf
#
# Windows events store their real payload as repeated sibling elements, all with the
# same tag name and differentiated only by a Name attribute:
#
#   <EventData>
#     <Data Name='SubjectUserSid'>S-1-5-18</Data>
#     <Data Name='LogonType'>5</Data>
#     <Data Name='LogonGuid'>{00000000-0000-0000-0000-000000000000}</Data>
#     ...
#   </EventData>
#
# Generic XML extraction (KV_MODE=xml in props.conf) turns repeated same-named elements
# into a single multivalue field with no idea which value is which - so KV_MODE=xml alone
# will NOT give you fields like LogonType or LogonGuid. This transform walks every
# <Data Name='...'>value</Data> pair in the event and extracts each one as its own
# properly-named field.
#
# Referenced from props.conf via: REPORT-eventdata = wevtutil_eventdata_kv

[wevtutil_eventdata_kv]
REGEX = <Data Name='([^']*)'>([^<]*)</Data>
FORMAT = $1::$2
REPEAT_MATCH = true
