# props.conf
#
# Custom sourcetype for XML produced by Convert-EvtxToXml.ps1 (wevtutil-based EVTX -> XML
# conversion). Splunk's built-in XmlWinEventLog sourcetype is built for live forwarder
# input, not a file containing many <Event> records wrapped in one <Events> root, and the
# auto-detected xml-2 sourcetype has no event-boundary logic for this shape either -
# without this stanza you'll get one giant Splunk event per file instead of one per
# Windows event.
#
# See ../README.md for deployment instructions and the reasoning behind each setting.

[wevtutil_rendered_xml]
NO_BINARY_CHECK = true
SHOULD_LINEMERGE = false
CHARSET = UTF-8
LINE_BREAKER = ()(?=<Event xmlns=)
TIME_PREFIX = <TimeCreated SystemTime='
MAX_TIMESTAMP_LOOKAHEAD = 500
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
KV_MODE = xml
REPORT-eventdata = wevtutil_eventdata_kv
FIELDALIAS-eventid  = Event.System.EventID AS EventID Event.System.EventID AS EventCode
FIELDALIAS-computer = Event.System.Computer AS Computer Event.System.Computer AS host_computer
FIELDALIAS-provider = Event.System.Provider.Name AS SourceName Event.System.Provider.Name AS Provider
FIELDALIAS-channel  = Event.System.Channel AS Channel Event.System.Channel AS LogName
category = Structured
pulldown_type = true
disabled = false
